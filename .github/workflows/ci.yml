name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      USE_SAMPLE_DATA: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:supabase-wired
      - run: npm run test:cruxy --if-present
      - run: npm run smoke:practice
      - run: npm run smoke:case-roles
      # Google Fonts downloads sometimes fail in CI (next/font); retry before failing.
      - run: npm run build || (sleep 20 && npm run build) || (sleep 40 && npm run build)
